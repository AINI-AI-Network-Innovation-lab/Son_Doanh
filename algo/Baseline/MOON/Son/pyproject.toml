[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fednova-moon"
version = "1.0.0"
description = "Federated Learning combining FedNova and MOON on CIFAR-10 with Flower Next-gen API"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "source.server_app:app"
clientapp = "source.client_app:app"

[tool.flwr.app.config]
# 1. Cấu hình cơ bản của vòng lặp FL
num-server-rounds = 30           # Tổng số vòng huấn luyện toàn cục
num-partitions = 10              # Tổng số client trong toàn mạng (chia dữ liệu Dirichlet non-IID)
fraction-evaluate = 1.0          # Tỷ lệ client tham gia đánh giá sau mỗi round
local-epochs = 1                 # Số epoch tối đa mỗi round tại client
learning-rate = 0.01             # Tốc độ học (learning rate) của optimizer SGD
batch-size = 32                  # Kích thước mỗi batch dữ liệu
save-model = false               # Có lưu trọng số mô hình cuối cùng ra file final_model.pt không

# 2. Cấu hình đặc thù FedNova (Hệ thống không đồng nhất - System Heterogeneity)
random-steps = true              # Bật mô phỏng client mạnh/yếu (ngẫu nhiên số bước chạy s_k)
min-steps-ratio = 0.2            # Tối thiểu chạy 20% số batch của client đó (tránh client chạy 0 bước)

# 3. Cấu hình đặc thù MOON (Model-Contrastive Federated Learning)
mu = 1.0                         # Trọng số phạt tương phản (L_total = L_ce + mu * L_con)
temperature = 0.5                # Nhiệt độ tau trong hàm mất mát tương phản InfoNCE
