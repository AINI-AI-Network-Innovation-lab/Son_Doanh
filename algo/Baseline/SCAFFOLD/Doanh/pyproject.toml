[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-scaffold-fedentropy"
version = "1.2.2"
description = "Federated Learning with SCAFFOLD and FedEntropy in Flower"
license = { file = "LICENSE" }
dependencies = [
    "flwr[simulation]>=1.28.0",
    "numpy>=2.0.2",
    "torch",
    "torchvision",
    "flwr-datasets",
    "datasets",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.30.0"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 15
fraction-evaluate = 0.5
learning-rate = 0.01
batch-size = 32
local-epochs = 2
save-model = false

# Siêu tham số SCAFFOLD & FedEntropy
server-lr = 1.0
entropy-gamma = 1.0
use-mej-filter = true