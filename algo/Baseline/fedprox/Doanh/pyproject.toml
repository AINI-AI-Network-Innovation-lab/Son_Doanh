# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo"
version = "1.2.2"
description = "Federated Learning with Numpy and Flower (Demo)"
license = { file = "LICENSE" }
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.28.0",
    "numpy>=2.0.2",
    "torch",
    "torchvision",
    "flwr-datasets",
    "datasets",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.30.0"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 15
fraction-evaluate = 0.5
learning-rate = 0.01
batch-size = 32
local-epochs = 2
save-model = false
